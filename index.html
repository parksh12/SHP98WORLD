<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>자산 운용</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;--line:#e1e0d9;--ring:rgba(11,11,11,.10);
--up:#d03b3b;--down:#2a78d6;--good:#006300;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--soft:#f0efec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:#2c2c2a;--ring:rgba(255,255,255,.10);
--up:#e66767;--down:#3987e5;--good:#0ca30c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--soft:#262624}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--line:#2c2c2a;--ring:rgba(255,255,255,.10);
--up:#e66767;--down:#3987e5;--good:#0ca30c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--soft:#262624}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 60px}
button,input{font:inherit}
.btn{border:1px solid var(--ring);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
/* 잠금 화면 */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:24px}
#lock h1{font-size:20px;margin:0 0 4px} #lock p{color:var(--mut);font-size:13px;margin:0 0 16px}
#lock input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#lock label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);margin:10px 0 14px}
#lock .btn{width:100%;padding:10px;background:var(--ink);color:var(--bg);border:0}
#lock .themebtn{width:auto;background:var(--card);color:var(--ink);border:1px solid var(--ring);padding:4px 10px}
#lock .err{color:var(--up);font-size:13px;min-height:20px;margin-top:8px}
#app{display:none}
/* 대시보드 */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0} .meta{color:var(--mut);font-size:13px}
.hbtn{display:flex;gap:6px}
.hero{margin:10px 0 22px} .hero .lbl{color:var(--ink2)} .hero .big{font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile,.card{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:16px}
.card{margin-bottom:16px}
.tile .lbl{color:var(--ink2);font-size:13px} .tile .val{font-size:20px;font-weight:650;margin:2px 0} .tile .sub{font-size:13px;color:var(--mut)}
.card .tiles{margin:14px 0 0} .card .tile{background:var(--bg)}
h2{font-size:16px;margin:0 0 12px}
.gnum{color:var(--ink2);margin-bottom:10px} .gnum b{font-size:28px;color:var(--ink);margin-right:4px}
.track{position:relative;height:14px;background:var(--line);border-radius:4px}
.fill{height:100%;background:var(--s1);border-radius:4px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.tlab{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:4px}
.bar{display:flex;gap:2px;height:36px;margin:4px 0 14px}
.seg{border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:3px}
.seg span{color:#fff;font-size:12px;font-weight:600;text-shadow:0 0 3px rgba(0,0,0,.45)}
.legend{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px} .legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums} .legend em{color:var(--mut);font-style:normal;width:64px;text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal} tr:last-child td{border-bottom:0}
.nm{font-weight:550} .tk{color:var(--mut);font-size:12px} .cashrow td{color:var(--ink2)}
.up{color:var(--up)} .down{color:var(--down)} .stale{color:var(--mut);font-size:11px}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.msrow{margin-bottom:10px} .msrow .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.msrow .top b{font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--mut)}
.badge.on{border-color:var(--good);color:var(--good);font-weight:600}
.note{color:var(--ink2);font-size:14px} .note b{color:var(--ink)} .note ul{margin:6px 0 0;padding-left:18px}
.warn{color:var(--up);font-size:13px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;opacity:0;white-space:nowrap;z-index:9}
header{align-items:center;margin-bottom:4px}
.hero{margin:0 0 14px} .hero .big{font-size:36px} .hero .sub{color:var(--ink2);font-size:14px}
.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{padding:10px 12px} .tile .val{font-size:17px} .tile .lbl,.tile .sub{font-size:12px}
.card{padding:12px 14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap} .mut{color:var(--mut);font-size:13px}
.bar{height:22px;margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)} .legend span{display:flex;align-items:center;gap:5px} .legend i{width:9px;height:9px;border-radius:2px}
td{padding:7px 6px} th{padding:4px 6px} tr.grp td{color:var(--mut);font-size:12px;padding-top:12px;border-bottom:1px solid var(--line)}

.tile .sub.up{color:var(--up)} .tile .sub.down{color:var(--down)}
td .q{color:var(--mut);font-size:12px;margin-left:6px;font-weight:400;white-space:nowrap} tr.cash td{color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:middle}
td.mut{font-size:13px}
td:first-child b{white-space:nowrap}
.q2{color:var(--mut);font-size:11px;font-weight:400;line-height:1.3}
@media (max-width:560px){table{font-size:13px} td,th{padding:6px 4px}}
.btn{padding:4px 10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hero .big{font-size:34px} td,th{padding:8px 6px}}
</style>
</head>
<body>
<div id="lock"><button class="btn themebtn" type="button" onclick="toggleTheme()" style="position:fixed;top:12px;right:12px" title="다크/라이트">🌙</button><form id="lockform" autocomplete="off">
 <h1>자산 운용</h1><p>비공개 페이지예요. 비밀번호를 입력하세요.</p>
 <input type="password" id="pw" placeholder="비밀번호" autofocus>
 <label><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
 <button class="btn" type="submit">열기</button>
 <div class="err" id="err"></div>
</form></div>

<div id="app"></div>
<div id="tip"></div>

<script>
"use strict";
const KEY_STORE = "asset_key_v1";
let DATA = null, PRICES = null;

// ---------- 암호 ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function deriveKey(pw, enc) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(key, enc) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const getJSON = u => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.json());
function store(fn) { try { return fn(); } catch { return null; } }

async function unlockWith(key, remember) {
  const enc = await getJSON("data.enc.json");
  DATA = await decrypt(key, enc);
  if (remember) { const raw = await crypto.subtle.exportKey("raw", key); store(() => localStorage.setItem(KEY_STORE, ub64(raw))); }
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  await refresh();
  setInterval(refresh, 5 * 60 * 1000);
}

document.getElementById("lockform").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "여는 중…";
  try {
    const enc = await getJSON("data.enc.json");
    const key = await deriveKey(document.getElementById("pw").value, enc);
    await unlockWith(key, document.getElementById("remember").checked);
  } catch { err.textContent = "비밀번호가 맞지 않아요."; }
});

document.querySelectorAll(".themebtn").forEach(b => b.textContent = themeIcon());
(async () => {
  const saved = store(() => localStorage.getItem(KEY_STORE));
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
    await unlockWith(key, false);
  } catch { store(() => localStorage.removeItem(KEY_STORE)); }
})();

function toggleTheme() {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  store(() => localStorage.setItem("theme", r.dataset.theme));
  document.querySelectorAll(".themebtn").forEach(b => b.textContent = dark ? "🌙" : "☀️");
}
function themeIcon() { const r = document.documentElement; return (r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) ? "☀️" : "🌙"; }
function lockNow() { store(() => localStorage.removeItem(KEY_STORE)); location.reload(); }

// ---------- 계산 ----------
const won = x => Math.round(x).toLocaleString("ko-KR") + "원";
const man = x => Math.round(x / 1e4).toLocaleString("ko-KR") + "만원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const signed = (x, pct) => `<span class="${x > 0 ? "up" : x < 0 ? "down" : ""}">${x > 0 ? "+" : ""}${won(x)}${pct == null ? "" : ` (${pct > 0 ? "+" : ""}${pct.toFixed(2)}%)`}</span>`;
const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };

function depositsSince(asOf, day, t) {
  let y = asOf.getFullYear(), m = asOf.getMonth(), n = 0;
  for (;;) { const d = new Date(y, m, day); if (d > t) return n; if (d > asOf) n++; m++; if (m > 11) { m = 0; y++; } }
}
function nextDeposit(day, t) { let d = new Date(t.getFullYear(), t.getMonth(), day); if (d <= t) d = new Date(t.getFullYear(), t.getMonth() + 1, day); return d; }
function monthsBetween(a, b) { return Math.max(0, (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth() - (b.getDate() < a.getDate() ? 1 : 0)); }
function fv(p, mo, r, n) { const i = r / 12; if (!i) return p + mo * n; const g = (1 + i) ** n; return p * g + mo * (g - 1) / i; }
function needed(p, target, r, n) { if (n <= 0) return 0; const i = r / 12; if (!i) return Math.max(0, (target - p) / n); const g = (1 + i) ** n; return Math.max(0, (target - p * g) * i / (g - 1)); }

function build() {
  const fx = PRICES.fx || 1350, t = today(), cats = {}, warn = [];
  DATA.categories.forEach(c => cats[c] = 0);
  const accounts = DATA.accounts.map(a => {
    let value = 0, cost = 0;
    const rows = a.holdings.map(h => {
      const usd = a.currency === "USD", k = usd ? fx : 1;
      let p = PRICES.prices[h.ticker], stale = false;
      if (p == null) { p = h.avg; stale = true; warn.push(`${h.name} 시세가 없어 평단가로 계산했어요.`); }
      const v = p * h.qty * k, c = h.avg * h.qty * k;
      value += v; cost += c; cats[h.category] = (cats[h.category] || 0) + v;
      return { ...h, price: p, value: v, cost: c, usd, stale };
    });
    const cash = (a.cash_usd || 0) * fx + (a.cash_krw || 0);
    cats["단기채·현금"] = (cats["단기채·현금"] || 0) + cash;
    return { name: a.name, rows, value, cost, cash };
  });
  const savings = DATA.savings.map(s => {
    const n = depositsSince(D(s.as_of), s.day, t), now = s.balance + n * s.monthly;
    cats[s.category] += now; return { ...s, now, next: nextDeposit(s.day, t) };
  });
  DATA.cash.forEach(c => cats[c.category] += c.amount);
  const total = Object.values(cats).reduce((a, b) => a + b, 0);
  return { fx, t, cats, accounts, savings, total, warn };
}

// ---------- 그리기 ----------
const pct = (v, c) => c ? (v - c) / c * 100 : 0;
const cls = x => x > 0.05 ? "up" : x < -0.05 ? "down" : "";
const sp = x => (x > 0 ? "+" : "") + x.toFixed(2) + "%";
const sw = x => (x > 0 ? "+" : "") + Math.round(x).toLocaleString("ko-KR") + "원";

function budgetSection() {
  const B = DATA.budget; if (!B) return "";
  const G = ["저축", "투자", "고정비", "생활"], col = { 저축: "var(--s1)", 투자: "var(--s6)", 고정비: "var(--s2)", 생활: "var(--s4)" };
  const sum = g => B.items.filter(i => i.group === g).reduce((s, i) => s + i.amount, 0);
  const used = B.items.reduce((s, i) => s + i.amount, 0), saveRate = (sum("저축") + sum("투자")) / B.income * 100;
  const bar = G.map(g => { const v = sum(g); return v ? `<div class="seg" style="flex:${v};background:${col[g]}" data-tip="${g} ${man(v)} · ${(v / B.income * 100).toFixed(0)}%"></div>` : ""; }).join("");
  const leg = G.map(g => `<span><i style="background:${col[g]}"></i>${g} ${man(sum(g))}</span>`).join("");
  const rows = G.map(g => B.items.filter(i => i.group === g).map(i =>
    `<tr><td><i class="dot" style="background:${col[g]}"></i>${esc(i.name)}${i.note ? `<span class="q">${esc(i.note)}</span>` : ""}</td><td class="mut">${esc(i.day || "")}</td><td class="mut">${esc(i.account || "")}</td><td>${won(i.amount)}</td></tr>`).join("")).join("");
  return `<section class="card"><div class="row"><b>월 자금 계획 · 실수령 ${man(B.income)}</b><span class="mut">저축·투자 ${saveRate.toFixed(0)}%${used !== B.income ? ` · 남는 돈 ${won(B.income - used)}` : ""}</span></div>
<div class="bar">${bar}</div><div class="legend">${leg}</div>
<div class="tbl" style="margin-top:8px"><table><thead><tr><th>항목</th><th>날짜</th><th>통장</th><th>금액</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function plannedSection() {
  const P = DATA.planned || []; if (!P.length) return "";
  const t = today();
  const rows = P.map(x => {
    const exact = /^\d{4}-\d{2}-\d{2}$/.test(x.when), d = exact ? D(x.when) : null;
    const dday = d ? Math.round((d - t) / 864e5) : null;
    const when = d ? `${d.getMonth() + 1}/${d.getDate()}${dday >= 0 ? ` <span class="q">D-${dday}</span>` : ""}` : esc(x.when) + "년";
    return `<tr><td><b>${esc(x.name)}</b><div class="q2">${esc(x.plan || "")}</div></td><td class="mut">${when}</td><td>${won(x.amount)}</td></tr>`;
  }).join("");
  return `<section class="card"><div class="row"><b>예정된 큰 지출</b><span class="mut">비상금에서 꺼내지 않기</span></div>
<div class="tbl"><table><tbody>${rows}</tbody></table></div></section>`;
}

function render(d) {
  const { cats, total, accounts, savings, fx, t } = d;
  const invVal = accounts.reduce((s, a) => s + a.value, 0), invCost = accounts.reduce((s, a) => s + a.cost, 0);
  const savNow = savings.reduce((s, x) => s + x.now, 0), savMonth = savings.reduce((s, x) => s + x.monthly, 0);
  const cashTotal = DATA.cash.reduce((s, c) => s + c.amount, 0);
  const g = DATA.goal, start = D(g.start), end = D(g.deadline), n = monthsBetween(t, end);
  const prog = Math.min(total / g.target, 1) * 100, elapsed = Math.min(Math.max((t - start) / (end - start), 0), 1) * 100;
  const need = needed(total, g.target, Math.max(...g.returns), n);
  const upd = PRICES.updated ? new Date(PRICES.updated).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
  const nextDep = savings.length ? savings[0].next : null;

  const tile = (l, v, sub, c = "") => `<div class="tile"><div class="lbl">${l}</div><div class="val">${v}</div><div class="sub ${c}">${sub}</div></div>`;
  const tiles = accounts.map(a => tile(esc(a.name.replace(/ \(.*\)/, "")), man(a.value + a.cash), a.cost ? `${sw(a.value - a.cost)} (${sp(pct(a.value, a.cost))})` : "", cls(a.value - a.cost))).join("")
    + tile("예적금", man(savNow), nextDep ? `${nextDep.getMonth() + 1}/${nextDep.getDate()} +${man(savMonth)}` : "")
    + tile("비상금", man(cashTotal), "");

  const segs = [], legend = [];
  Object.entries(cats).forEach(([c, v], i) => { if (v <= 0) return; const p = v / total * 100;
    segs.push(`<div class="seg" style="flex:${v.toFixed(0)};background:var(--s${i + 1})" data-tip="${esc(c)} ${man(v)} · ${p.toFixed(1)}%"></div>`);
    legend.push(`<span><i style="background:var(--s${i + 1})"></i>${esc(c)} ${p.toFixed(0)}%</span>`); });

  const rows = accounts.map(a => `<tr class="grp"><td colspan="5">${esc(a.name.replace(/ \(.*\)/, ""))}</td></tr>` +
    [...a.rows].sort((x, y) => y.value - x.value).map(r => {
      const f = x => r.usd ? "$" + x.toFixed(2) : Math.round(x).toLocaleString("ko-KR") + "원", pc = pct(r.value, r.cost);
      return `<tr><td><b>${esc(r.ticker.match(/^\d/) ? r.name.replace(" 미국", " ") : r.ticker)}</b><div class="q2">${r.qty}주</div></td>
        <td>${f(r.price)}${r.stale ? "*" : ""}<div class="q2">${f(r.avg)}</div></td><td>${won(r.value)}</td><td class="${cls(pc)}">${sw(r.value - r.cost)}</td><td class="${cls(pc)}">${sp(pc)}</td></tr>`; }).join("")
    + (a.cash > 1e4 ? `<tr class="cash"><td>예수금</td><td></td><td>${won(a.cash)}</td><td></td><td></td></tr>` : "")).join("");

  const M = DATA.milestones || {}, held = {};
  accounts.forEach(a => a.rows.forEach(r => held[r.ticker] = (held[r.ticker] || 0) + r.qty));
  const badges = [
    ...Object.entries(M.shares || {}).map(([tk, lv]) => { const q = held[tk] || 0, nx = lv.find(x => x > q);
      return nx ? `<span class="badge">${tk.match(/^\d/) ? "나스닥100" : tk} ${q}/${nx}주</span>` : `<span class="badge on">${tk} ${q}주 ✓</span>`; }),
    (() => { const nx = (M.invest_krw || []).find(x => x > invVal); return nx ? `<span class="badge">투자 ${man(invVal)}/${man(nx)}</span>` : ""; })(),
  ].join("");

  document.getElementById("app").innerHTML = `<main>
<header><div class="meta">${upd} · ₩${Math.round(fx).toLocaleString()}/$</div>
<div class="hbtn"><button class="btn themebtn" onclick="toggleTheme()" title="다크/라이트">${themeIcon()}</button><button class="btn" onclick="refresh()" title="새로고침">↻</button><button class="btn" onclick="lockNow()" title="잠그기">🔒</button></div></header>
<div class="hero"><div class="big">${won(total)}</div>
<div class="sub">투자 ${man(invVal)} <span class="${cls(invVal - invCost)}">${signed(invVal - invCost).replace(/<[^>]+>/g, "")} (${sp(pct(invVal, invCost))})</span></div></div>
${d.warn.length ? `<div class="warn">* 시세 없음: 평단가로 표시</div>` : ""}
<div class="tiles">${tiles}</div>
<section class="card"><div class="row"><b>${(g.target / 1e8).toFixed(0)}억 목표 ${prog.toFixed(1)}%</b><span class="mut">${n}개월 남음 · 월 ${man(need)} 필요</span></div>
<div class="track"><div class="fill" style="width:${prog.toFixed(2)}%"></div><div class="tick" style="left:${elapsed.toFixed(2)}%"></div></div></section>
<section class="card"><div class="bar">${segs.join("")}</div><div class="legend">${legend.join("")}</div></section>
<section class="card"><div class="tbl"><table><thead><tr><th>종목</th><th>현재가<div class="q2">평단가</div></th><th>평가금액</th><th>수익금</th><th>수익률</th></tr></thead><tbody>${rows}</tbody></table></div>
${badges ? `<div class="badges">${badges}</div>` : ""}</section>
${budgetSection()}
${plannedSection()}
</main>`;
  bindTips();
}

function bindTips() {
  const tip = document.getElementById("tip");
  document.querySelectorAll(".seg").forEach(s => {
    s.addEventListener("mousemove", e => { tip.textContent = s.dataset.tip; tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; });
    s.addEventListener("mouseleave", () => tip.style.opacity = 0);
  });
}

async function refresh() {
  try { PRICES = await getJSON("prices.json"); } catch { PRICES = PRICES || { prices: {}, fx: null }; }
  render(build());
}
</script>
</body></html>
