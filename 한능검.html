<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassPick | 한국사능력검정시험 무료 강의</title>
  
  <!-- Pretendard 폰트 불러오기 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    /* ==========================================
       1. Global Styles & CSS Variables
       ========================================== */
    :root {
      --primary: #2563eb;       /* Deep Indigo / Royal Blue */
      --primary-hover: #1d4ed8;
      --secondary: #10b981;     /* Soft Lime / Mint Point */
      --bg-main: #f8fafc;       /* Light Gray Background */
      --bg-card: #ffffff;
      --text-main: #0f172a;     /* Dark Navy/Slate */
      --text-muted: #64748b;    /* Slate Muted */
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 16px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ==========================================
       2. Header
       ========================================== */
    .header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .logo-highlight {
      color: var(--primary);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-menu a {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: var(--primary);
    }

    .btn-suggest {
      background-color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 20px;
      color: var(--text-main) !important;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .btn-suggest:hover {
      background-color: #e2e8f0;
    }

    /* ==========================================
       3. Hero Section
       ========================================== */
    .hero-section {
      padding: 50px 0 30px;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, var(--bg-main) 100%);
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .text-gradient {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================
       4. Course List Section
       ========================================== */
    .featured-section {
      padding: 30px 0 80px;
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .course-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
    }

    .course-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    /* [채널명 / 강사] */
    .channel-name {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 700;
      display: block;
      margin-bottom: 6px;
    }

    /* [강의 제목] */
    .course-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* [이미지 영역] */
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 비율 */
      background-color: #e2e8f0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .card-thumb-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* [용도 뱃지] */
    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background-color: rgba(16, 185, 129, 0.9);
      color: #ffffff;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    /* [강의 설명] */
    .course-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* [총 강의 수 / 평균 강의 시간] */
    .card-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      margin-top: auto;
      flex-wrap: wrap;
    }

    .card-tag {
      font-size: 0.75rem;
      background-color: var(--bg-main);
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--text-main);
      font-weight: 600;
    }

    /* [연결 링크] */
    .btn-card {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--primary);
      color: #fff;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-card:hover {
      background-color: var(--primary-hover);
    }

    /* ==========================================
       5. Modal Styles
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-card {
      background: #ffffff;
      width: 90%;
      max-width: 440px;
      padding: 32px;
      border-radius: var(--radius-md);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-body {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .email-display {
      background-color: var(--bg-main);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin: 12px 0;
      word-break: break-all;
    }

    .btn-submit {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* ==========================================
       6. Footer
       ========================================== */
    .footer {
      background-color: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 30px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    @media (max-width: 768px) {
      .hero-title {
        font-size: 1.8rem;
      }
      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
