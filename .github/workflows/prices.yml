name: 시세 갱신

on:
  schedule:
    - cron: "*/30 0-7 * * 1-5"    # 한국장 (KST 09~16시)
    - cron: "*/30 13-21 * * 1-5"  # 미국장 (KST 22~06시)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "알림 메일 테스트"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python scripts/fetch_prices.py
      - id: alert
        env:
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python scripts/alert.py
      - name: commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json alerts.json
          git diff --cached --quiet || (git commit -m "시세 갱신" && git push)
      - name: notify (telegram)
        if: steps.alert.outputs.level != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "TELEGRAM 시크릿 없음"; exit 0; }
          TEXT="📉 S&P500 고점 대비 ${{ steps.alert.outputs.level }}% 도달
          현재 ${{ steps.alert.outputs.last }} / 사상 최고 ${{ steps.alert.outputs.ath }} (${{ steps.alert.outputs.dd }}%)
          → SGOV 대기자금으로 SPYM 검토 (규칙: SPYM만)"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${TEXT}" > /dev/null
