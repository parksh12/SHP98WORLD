<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국사능력검정시험(심화) | 최태성</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --primary: #ef4444; /* 유튜브 아이덴티티 레드 */
      --primary-hover: #dc2626;
      --primary-light: #f87171;
      --accent-gold: #eab308;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border: #334155;
      --radius-sm: 8px;
      --radius-md: 14px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 80px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Header & Navigation */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .logo i {
      color: var(--accent-gold);
      font-size: 1.5rem;
    }

    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .back-home-btn:hover {
      color: var(--text-main);
      border-color: var(--primary-light);
    }

    /* Container */
    .container {
      max-width: 500px;
      margin: 5rem auto 0;
      padding: 0 1.5rem;
    }

    /* Course Card */
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: var(--shadow);
    }

    .course-meta {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
    }

    .badge-purple {
      background: rgba(239, 68, 68, 0.15);
      color: var(--primary-light);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-gold {
      background: rgba(234, 179, 8, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .course-info {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .course-info p {
      font-size: 1.05rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .course-info p strong {
      color: var(--text-main);
    }

    .enter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .enter-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Footer */
    footer {
      margin-top: 4rem;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>한국사능력검정시험(심화)</span>
      </div>
      <!-- 홈 바로가기 버튼 -->
      <a href="index.html" class="back-home-btn">
        <i class="fa-solid fa-house"></i> 홈 바로가기
      </a>
    </div>
  </header>

  <div class="container">

    <!-- 단일 강좌 카드 -->
    <div class="course-card">
      <div class="course-meta">
        <span class="badge badge-purple"><i class="fa-solid fa-play"></i> 총 강의수: 40강</span>
        <span class="badge badge-gold"><i class="fa-solid fa-user"></i> 강의자: 최태성</span>
      </div>

      <div class="course-info">
        <p><i class="fa-solid fa-book-bookmark" style="color: var(--primary-light);"></i> 강좌명: <strong>한국사능력검정시험(심화) 40강</strong></p>
      </div>

      <!-- 외부 유튜브 재생목록 링크 연결 -->
      <a href="https://www.youtube.com/watch?v=1Sp3EuDlZgM&list=PLE7ogCa1_I6suFmGQa5-Uj_ZF4H1KdMZw" target="_blank" class="enter-btn">
        <i class="fa-brands fa-youtube" style="font-size: 1.2rem;"></i> 강의 바로가기
      </a>
    </div>

    <!-- Footer -->
    <footer>
      <p>강의 출처: YouTube 최태성 1TV</p>
    </footer>

  </div>

</body>
</html>
